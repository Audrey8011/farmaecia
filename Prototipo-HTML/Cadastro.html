<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — Farma &amp; Cia</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav>
        <ul>
            <li>
                <a href="index.html"><img src="pngtree-colorful-cartoon-pharmacy-design-png-image_20897310.png" alt="Logo da Farma &amp; Cia">Farma&amp;Cia</a>
            </li>
            <li class="links">
                <a href="ofertas.html">Ofertas</a>
                <a href="Cadastro.html">Entre/Cadastre-se</a>
            </li>
        </ul>
    </nav>

    <form class="form-cadastro" action="#" method="post">
        <h1>Criar conta</h1>
        <p>Preencha os campos para criar a sua conta.</p>

        <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="campo">
            <label for="senha">Senha (mínimo de 8 caracteres)</label>
            <input type="password" id="senha" name="senha" minlength="8" required>
        </div>

        <div class="campo">
            <label for="confirmar">Confirme a senha</label>
            <input type="password" id="confirmar" name="confirmarSenha" minlength="8" required>
        </div>

        <button class="botao" type="submit">Criar conta</button>

        <p style="margin-bottom:0">
            Já tem conta?
            <a href="index.html">Voltar à loja</a>
        </p>
    </form>
</body>
</html>
